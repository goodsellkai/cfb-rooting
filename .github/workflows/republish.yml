# Rebuilds the pages from the numbers already on the site, without simulating.
#
# For a change to a template, the stylesheet, a header or anything else that
# does not move a number. It reads the live site, writes the pages again from
# current code, copies the data through untouched, and deploys. About two
# minutes, against about seventy-five for a full build.
#
# Manual only. A model change has to go through "Publish site", because the
# numbers here are whatever is already published.

name: Republish site

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Site to read the published numbers from"
        default: "https://cfbroot.com"

permissions:
  contents: read

# The same group as the full build. A republish that read the data tree while
# a build was deploying into it would mix two builds together, and two
# deployments racing would leave whichever finished last.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  republish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install .

      - name: Rebuild the pages and deploy
        env:
          CFBROOT_SITE_URL: ${{ vars.SITE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SOURCE: ${{ github.event.inputs.source }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No Cloudflare token, so there is nowhere to publish to." >&2
            exit 1
          fi
          cfbroot republish --out site --source "${SOURCE:-https://cfbroot.com}"
          # The guard a full build gets from its own numbers does not apply
          # here, so check the tree is whole before replacing the live one.
          teams=$(find site/team -name index.html | wc -l)
          echo "$teams team pages, $(find site/data -name '*.json' | wc -l) data files"
          if [ "$teams" -lt 130 ]; then
            echo "only $teams team pages: not publishing" >&2
            exit 1
          fi
          grep -q cloudflareinsights site/_headers \
            || echo "note: the analytics beacon is not allowed in _headers"
          npm install -g wrangler@3 >/dev/null
          wrangler pages deploy site --project-name=cfbroot --branch=main
