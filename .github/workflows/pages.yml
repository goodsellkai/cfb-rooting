# Simulates the season and publishes the app to GitHub Pages as static files.
#
# Needs Pages set to deploy from GitHub Actions (Settings > Pages > Source).
# The data comes from ESPN; the CFBD_API_KEY secret is only a fallback.

name: Publish site

on:
  schedule:
    # Times are UTC. GitHub delivers a handful of scheduled events a day
    # whatever is asked for: on a Saturday in October it started five runs
    # out of forty-eight, and the weekday one lands about five hours late.
    # So the hours below are chances to be started rather than a timetable,
    # and a run started on a game day keeps rebuilding by itself.
    - cron: "5 22,23 * * 5"      # Friday 5pm and 6pm Central
    - cron: "5,35 * * * 6"       # Friday 7pm to Saturday 6pm Central
    - cron: "5,35 0-8 * * 0"     # Saturday 7pm to Sunday 3am Central
    - cron: "5 12 * * 0-5"       # 7am Central, Sunday to Friday
  workflow_dispatch:
    inputs:
      minutes:
        description: "Keep rebuilding for this many minutes"
        default: "0"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Two and a half million seasons, each rated with the full Massey model,
    # is about an hour on GitHub's four-core runners, and a game day run
    # does several of them. A job may last six hours; the loop leaves room.
    timeout-minutes: 345
    env:
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install .

      # The simulator is compiled on first use, which takes a minute and a
      # half. Keeping the compiled code saves that on every build. The key
      # changes whenever the source, the dependencies or the CPU model does,
      # so a stale copy is never used.
      - name: Identify CPU
        id: cpu
        run: echo "model=$(grep -m1 'model name' /proc/cpuinfo | md5sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Keep the compiled simulator
        uses: actions/cache@v4
        with:
          path: .numba-cache
          key: numba-${{ runner.os }}-${{ steps.cpu.outputs.model }}-${{ hashFiles('src/cfbroot/**/*.py', 'pyproject.toml') }}

      # Numba checks cached code against the source file's time stamp, and a
      # fresh install gives every file a new one. The cache key above already
      # changes with the source, so a fixed stamp is safe.
      - name: Fix source time stamps
        run: |
          pkg="$(python -c 'import cfbroot, os; print(os.path.dirname(cfbroot.__file__))')"
          find "$pkg" -name '*.py' -exec touch -d '2000-01-01 00:00:00' {} +

      # Cloudflare serves the site once its secrets are set; until then the
      # GitHub Pages copy below is the live one.
      #
      # On a game day the run does not stop after one build. Scores land all
      # afternoon and the odds move with them, so it builds, publishes, and
      # goes round again until its time is up. A build that fails waits five
      # minutes and tries again, since it is usually ESPN having a moment.
      - name: Simulate and publish
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CFBROOT_SITE_URL: ${{ vars.SITE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ASKED_FOR: ${{ github.event.inputs.minutes }}
        run: |
          budget="${ASKED_FOR:-0}"
          day=$(date -u +%u); hour=$(date -u +%H)
          if [ "$budget" = "0" ] \
             && { [ "$day" = "6" ] || { [ "$day" = "7" ] && [ "$hour" -lt 9 ]; }; }
          then
            budget=285                      # Saturday, and Saturday night
          fi
          # A bare test that fails would end the step, since the shell stops
          # on the first error.
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npm install -g wrangler@3 >/dev/null
          fi
          start=$(date +%s); n=0
          while :; do
            n=$((n + 1))
            echo "::group::build $n, $(date -u +%H:%M) UTC"
            if cfbroot export --out site; then
              if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
                wrangler pages deploy site --project-name=cfbroot --branch=main
              fi
            else
              echo "that build did not finish; waiting before the next one"
              sleep 300
            fi
            echo "::endgroup::"
            spent=$(( ($(date +%s) - start) / 60 ))
            # Only start another if it would be published inside the budget.
            if [ $((spent + 75)) -gt "$budget" ]; then
              echo "$n build(s) in $spent minutes; stopping"
              break
            fi
          done

      # Once SITE_URL names the real domain, Cloudflare serves the site and
      # the GitHub Pages copy becomes a signpost to it, so old links and
      # anything search engines still hold keep working.
      - name: Prepare the GitHub Pages copy
        id: ghpages
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "path=site" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p redirect
          cat > redirect/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>CFB Rooting Guide has moved</title>
          <link rel="canonical" href="$SITE_URL/">
          <meta http-equiv="refresh" content="0; url=$SITE_URL/">
          <script>
          // Keep the part of the address after the project name, so a link to
          // a team lands on that team.
          var rest = location.pathname.replace(/^\/cfb-rooting/, "");
          location.replace("$SITE_URL" + (rest === "/" ? "/" : rest) + location.search);
          </script>
          </head>
          <body><p>This site is now at <a href="$SITE_URL/">$SITE_URL</a>.</p></body>
          </html>
          HTML
          sed 's/^          //' -i redirect/index.html
          cp redirect/index.html redirect/404.html
          echo "path=redirect" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.ghpages.outputs.path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
