# Simulates the season and publishes the app to GitHub Pages as static files.
#
# Needs Pages set to deploy from GitHub Actions (Settings > Pages > Source).
# The data comes from ESPN; the CFBD_API_KEY secret is only a fallback.

name: Publish site

on:
  schedule:
    # Times are UTC. Hourly from 5pm Central on Friday through the last West
    # Coast games early Sunday, then once a day to pick up rating updates.
    # Minute 5 because GitHub delays jobs queued on the hour.
    - cron: "5 22,23 * * 5"      # Friday 5pm and 6pm Central
    - cron: "5 * * * 6"          # Friday 7pm to Saturday 6pm Central
    - cron: "5 0-8 * * 0"        # Saturday 7pm to Sunday 3am Central
    - cron: "5 12 * * 0-5"       # 7am Central, Sunday to Friday
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Two and a half million seasons, each rated with the full Massey model,
    # is about an hour and a quarter on GitHub's four-core runners. That is
    # longer than the hourly Saturday schedule, so on Saturdays builds run
    # back to back rather than on the hour.
    timeout-minutes: 180
    env:
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install .

      # The simulator is compiled on first use, which takes a minute and a
      # half. Keeping the compiled code saves that on every build. The key
      # changes whenever the source, the dependencies or the CPU model does,
      # so a stale copy is never used.
      - name: Identify CPU
        id: cpu
        run: echo "model=$(grep -m1 'model name' /proc/cpuinfo | md5sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Keep the compiled simulator
        uses: actions/cache@v4
        with:
          path: .numba-cache
          key: numba-${{ runner.os }}-${{ steps.cpu.outputs.model }}-${{ hashFiles('src/cfbroot/**/*.py', 'pyproject.toml') }}

      # Numba checks cached code against the source file's time stamp, and a
      # fresh install gives every file a new one. The cache key above already
      # changes with the source, so a fixed stamp is safe.
      - name: Fix source time stamps
        run: |
          pkg="$(python -c 'import cfbroot, os; print(os.path.dirname(cfbroot.__file__))')"
          find "$pkg" -name '*.py' -exec touch -d '2000-01-01 00:00:00' {} +

      - name: Simulate and export
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CFBROOT_SITE_URL: ${{ vars.SITE_URL }}
        run: cfbroot export --out site

      # Cloudflare serves the site once its secrets are set; until then the
      # GitHub Pages copy below is the live one.
      - name: Publish to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=cfbroot --branch=main

      # Once SITE_URL names the real domain, Cloudflare serves the site and
      # the GitHub Pages copy becomes a signpost to it, so old links and
      # anything search engines still hold keep working.
      - name: Prepare the GitHub Pages copy
        id: ghpages
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "path=site" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p redirect
          cat > redirect/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>CFB Rooting Guide has moved</title>
          <link rel="canonical" href="$SITE_URL/">
          <meta http-equiv="refresh" content="0; url=$SITE_URL/">
          <script>
          // Keep the part of the address after the project name, so a link to
          // a team lands on that team.
          var rest = location.pathname.replace(/^\/cfb-rooting/, "");
          location.replace("$SITE_URL" + (rest === "/" ? "/" : rest) + location.search);
          </script>
          </head>
          <body><p>This site is now at <a href="$SITE_URL/">$SITE_URL</a>.</p></body>
          </html>
          HTML
          sed 's/^          //' -i redirect/index.html
          cp redirect/index.html redirect/404.html
          echo "path=redirect" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.ghpages.outputs.path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
